name: Deploy to Homelab

# Deploys only after CI passes on main, and builds the exact commit CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: meals-prod
  cancel-in-progress: true

jobs:
  build-and-push:
    # Only a passing CI run from a push to main in this repository; CI also runs on
    # pull requests, and a fork's branch can be named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # GitHub-hosted runner. Use [self-hosted, homelab] (CT 111) only for jobs that must reach the LAN.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    env:
      REPO_NAME: ${{ github.event.repository.name }}
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_FULL: ${{ github.repository }}
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag current latest as rollback
        env:
          FULL_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        run: |
          docker pull "$FULL_IMAGE:latest" 2>/dev/null && \
          docker tag "$FULL_IMAGE:latest" "$FULL_IMAGE:rollback" && \
          docker push "$FULL_IMAGE:rollback" || \
          echo "No existing latest image to tag as rollback (first deploy)"

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:sha-${{ env.SHA }}

      - name: Notify on failure
        if: failure()
        env:
          PO_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PO_USER: ${{ secrets.PUSHOVER_USER_KEY }}
        run: |
          if [ -n "$PO_USER" ] && [ -n "$PO_TOKEN" ]; then
            curl -s -F "token=$PO_TOKEN" \
                 -F "user=$PO_USER" \
                 -F "title=Deploy Failed: $REPO_NAME" \
                 -F "message=Build failed for $REPO_FULL on commit ${COMMIT_SHA:0:7}" \
                 -F "priority=1" \
                 https://api.pushover.net/1/messages.json
          fi


  rollout:
    # Rolls the new image onto VM 110 as soon as it is pushed, then proves the
    # running container is this build and healthy. Runs on the CT 111 runner
    # because VM 110 is only reachable on the LAN. Off until the repository
    # variable HOMELAB_ROLLOUT is "true", so a missing runner never leaves a
    # deploy queued; Watchtower stays as the fallback either way. The SSH target
    # comes from the HOMELAB_SSH_TARGET repository variable.
    needs: build-and-push
    if: vars.HOMELAB_ROLLOUT == 'true'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 10
    env:
      # Repository variable, e.g. user@host, kept out of the repo.
      VM110: ${{ vars.HOMELAB_SSH_TARGET }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
      DIGEST: ${{ needs.build-and-push.outputs.digest }}
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Pull and restart meals on VM 110
        run: |
          [ -n "$VM110" ] || { echo "Set the HOMELAB_SSH_TARGET repository variable"; exit 1; }
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$VM110" \
            "sg docker -c 'cd /opt/apps && docker compose pull meals && docker compose up -d meals'"

      - name: Confirm the running container is this build and healthy
        run: |
          # The script runs on VM 110. It checks the image digest the meals
          # container runs, then waits on the container's own healthcheck
          # (the origin lockdown blocks direct HTTP to the proxied port).
          ssh -o BatchMode=yes -o ConnectTimeout=10 "$VM110" bash -s -- "$DIGEST" <<'EOF'
          set -eu
          digest="$1"
          image=$(sg docker -c "docker inspect --format '{{.Image}}' meals")
          repo_digests=$(sg docker -c "docker image inspect --format '{{range .RepoDigests}}{{.}} {{end}}' $image")
          echo "Running: $repo_digests"
          echo "Built:   $digest"
          case " $repo_digests" in
            *"@$digest "*) echo "meals runs this build" ;;
            *) echo "meals is not running the image this workflow built"; exit 1 ;;
          esac
          for i in $(seq 1 24); do
            health=$(sg docker -c "docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' meals")
            case "$health" in
              healthy|none) echo "health: $health"; exit 0 ;;
            esac
            sleep 5
          done
          echo "meals did not report healthy within 2 minutes (last: $health)"
          exit 1
          EOF

      - name: Notify
        if: always()
        env:
          PO_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PO_USER: ${{ secrets.PUSHOVER_USER_KEY }}
          OUTCOME: ${{ job.status }}
        run: |
          [ -n "$PO_USER" ] && [ -n "$PO_TOKEN" ] || exit 0
          if [ "$OUTCOME" = "success" ]; then
            title="Deployed: $REPO_NAME"; msg="$REPO_NAME is running ${COMMIT_SHA:0:7}"; prio=0
          else
            title="Rollout failed: $REPO_NAME"; msg="$REPO_NAME did not update to ${COMMIT_SHA:0:7}; check the Deploy run"; prio=1
          fi
          curl -s -F "token=$PO_TOKEN" -F "user=$PO_USER" -F "title=$title" \
               -F "message=$msg" -F "priority=$prio" https://api.pushover.net/1/messages.json >/dev/null

# Without HOMELAB_ROLLOUT, Watchtower on VM 110 polls GHCR (~60s) and updates the
# container on its own; the rollout job above makes that immediate and verified.
